# buf checks the committed .proto files on every pull request to main (.github/workflows/buf.yml): lint with buf's
# STANDARD rules, and breaking changes against the pull request's base commit with the FILE rules. Locally: buf lint;
# buf breaking --against '.git#branch=main'.
version: v2
modules:
  - path: contract-${serviceName}/src/main/proto
deps:
  # google/rpc/error_details.proto, which the contract imports so that server reflection serves the error details.
  - buf.build/googleapis/googleapis
lint:
  use:
    - STANDARD
  except:
    # AIP standard methods return the resource itself (GetItem returns Item) and share it between methods, which these
    # three rules forbid.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
  ignore_only:
    # Unused by any message on purpose: grpcurl needs it, so that reflection serves the ErrorInfo and BadRequest it
    # decodes.
    IMPORT_USED:
      - contract-${serviceName}/src/main/proto/${packageInPathFormat}/v1/${serviceName}.proto
breaking:
  use:
    - FILE
