# The database of the local environment: docker compose up -d. Local compose only: the database, user name and
# password below are for this throwaway container, and data-books' config-local.yaml repeats them. Every other
# environment gives the store its own credentials through environment variables.
#
# The image is the tag with its digest, the one SynapseContainers.POSTGRES_IMAGE pins for the tests, so local runs and
# the tests use one image, and a re-pushed tag can't change it. Update both together.
services:
  books-db:
    image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    environment:
      POSTGRES_DB: bookstore
      POSTGRES_USER: bookstore
      POSTGRES_PASSWORD: bookstore
    ports:
      - "5432:5432"
