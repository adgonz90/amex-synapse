# Configuration of the book catalog sample. The synapse.* values below are the defaults unless a comment says
# otherwise; they are listed to show what you can change while trying the service. Every property is in
# docs/modules/ROOT/pages/reference/configuration-properties.adoc.
#
# Profiles: run with --spring.profiles.active=dev to see "detail" in problem responses. dev needs no settings of its
# own: it is one of Synapse's non-production profiles (synapse.environment.non-production-profiles: dev,local,test).
# With no active profile the service counts as production and hides "detail".

spring:
  application:
    name: rest-books
  threads:
    virtual:
      # Requests run on virtual threads; Synapse's concurrency limit (below) is then what caps the work in flight.
      enabled: true

synapse:
  correlation:
    # Read from this request header (a new id is generated when it is absent or invalid), echoed on every response,
    # errors included, and written to the logs as correlationId.
    header: X-Correlation-Id
  # Whether problem responses carry "detail" (the formatted message). Unset, as here: shown when a non-production
  # profile is active, hidden otherwise. An explicit true or false always wins.
  # errors:
  #   include-detail: true
  # A public-facing service drops the context headers and baggage that callers send:
  # context:
  #   inbound:
  #     trusted: false
  api:
    rest:
      context:
        headers:
          # Not a default: maps the X-Channel request header to the request-context attribute "channel".
          # POST /books binds it into CreateBookRequest.channel (see BooksRestConfiguration).
          channel: X-Channel
      deadline:
        # The caller's budget in milliseconds (Request-Timeout: 2000), capped by max; default when absent.
        header: Request-Timeout
        default: 10s
        max: 30s
      # Request body limit for every route. POST and PUT /books set their own, smaller limit (16KB).
      max-request-size: 1MB
      # Requests in flight before the service answers 503 with Retry-After. Actuator paths are never limited.
      max-concurrent-requests: 200

management:
  otlp:
    metrics:
      export:
        # Not a default. Boot pushes metrics to an OpenTelemetry collector at http://localhost:4318 every minute and
        # logs a WARN when none is there. Turn it on (and set management.otlp.metrics.export.url) when you run one.
        # Traces and logs are exported only once their endpoints are set (management.opentelemetry.*.export.otlp).
        enabled: false
