# Configuration of the book catalog sample. The synapse.* values below are the defaults unless a comment says
# otherwise; they are listed to show what you can change while trying the service. Every property is in
# docs/modules/ROOT/pages/reference/configuration-properties.adoc.

spring:
  application:
    name: rest-books
  profiles:
    # The environment: exactly one, with its own application-<env>.yaml. The platform sets ENV; local runs use local
    # (application-local.yaml), and the tests use test (src/test/resources/application-test.yaml).
    active: ${ENV}
  threads:
    virtual:
      # Requests run on virtual threads; Synapse's concurrency limit (below) is then what caps the work in flight.
      enabled: true
  grpc:
    server:
      # The gRPC server (Netty), next to Tomcat on 8080. 9090 is Spring Boot's default.
      port: 9090
      # Server reflection (what grpcurl list and describe use) is off unless spring.grpc.server.reflection.enabled
      # is true; Synapse sets that default in every environment. application-local.yaml turns it on for local runs.
      # reflection:
      #   enabled: true

synapse:
  correlation:
    # Read from this request header (a new id is generated when it is absent or invalid), echoed on every response,
    # errors included, and written to the logs as correlationId. gRPC uses the same name as metadata key
    # (x-correlation-id).
    header: X-Correlation-Id
  # Whether problem responses carry "detail" (the formatted message): off unless include-detail is true.
  # application-local.yaml turns it on for local runs.
  # errors:
  #   include-detail: true
  # A public-facing service drops the context headers and baggage that callers send:
  # context:
  #   inbound:
  #     trusted: false
  api:
    rest:
      context:
        headers:
          # Not a default: maps the X-Channel request header to the request-context attribute "channel".
          # POST /books binds it into CreateBookRequest.channel (see BooksRestConfiguration).
          channel: X-Channel
      deadline:
        # The caller's budget in milliseconds (Request-Timeout: 2000), capped by max; default when absent.
        header: Request-Timeout
        default: 10s
        max: 30s
      # Request body limit for every route. POST and PUT /books set their own, smaller limit (16KB).
      max-request-size: 1MB
      # Requests in flight before the service answers 503 with Retry-After. Actuator paths are never limited.
      max-concurrent-requests: 200
      # Paging (GET /books). The page size is under synapse.paging: default-size 20, max-size 100.
      # paging:
      #   # The largest offset a caller may request (?offset=); a larger one is a 400. Callers page further by cursor.
      #   max-offset: 1000
      #   cursor:
      #     # The base64 256-bit key that encrypts the paging cursors; create one with: openssl rand -base64 32
      #     # Unset (or blank), a key is generated at every start: cursors then fail with 400 after a restart or on
      #     # another instance, and every start logs a WARN that says so. Give every instance the same key, from
      #     # the environment or a secret store, never from a file in the repository. As written, the service doesn't
      #     # start when BOOKS_CURSOR_KEY isn't set (the unresolved placeholder isn't a valid key); ${BOOKS_CURSOR_KEY:}
      #     # would fall back to a generated key instead.
      #     key: ${BOOKS_CURSOR_KEY}
    grpc:
      context:
        metadata:
          # Not a default: maps the x-channel metadata key to the request-context attribute "channel", as X-Channel
          # does over REST. CreateBook binds it into CreateBookRequest.channel (see BooksGrpcConfiguration).
          channel: x-channel
      deadline:
        # The caller's gRPC deadline, capped by max; default when the call has none.
        default: 10s
        max: 30s
      # Calls in flight before the service answers UNAVAILABLE with RetryInfo. Health and reflection are never
      # counted. Message and metadata sizes are spring.grpc.server.* settings (Synapse sets 16KB for metadata).
      max-concurrent-calls: 200

management:
  otlp:
    metrics:
      export:
        # Not a default. Boot pushes metrics to an OpenTelemetry collector at http://localhost:4318 every minute and
        # logs a WARN when none is there. Turn it on (and set management.otlp.metrics.export.url) when you run one.
        # Traces and logs are exported only once their endpoints are set (management.opentelemetry.*.export.otlp).
        enabled: false
