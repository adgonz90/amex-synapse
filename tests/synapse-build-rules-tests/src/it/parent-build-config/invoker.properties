# help:effective-pom writes the effective POM for verify.groovy; verify runs the tests and, through the process-aot
# execution of the parent's aot profile (Spring AOT processing is opt-in), AOT processing.
invoker.goals = help:effective-pom -Doutput=effective-pom.xml verify -Dspotless.check.skip=true -Dspotless.apply.skip=true
invoker.profiles = aot
invoker.buildResult = success
# Competing environment sources, as on a platform: application.yaml maps ENV, and Spring Boot reads SPRING_PROFILES_ACTIVE.
# The build environment must still be the only one in AOT processing (verify.groovy checks E3Marker is absent).
invoker.environmentVariables.ENV = e3
invoker.environmentVariables.SPRING_PROFILES_ACTIVE = e3
