# -Pimage package on a reactor whose service has application-build.yaml: the enforcer check passes, and the image
# profile binds build-image-no-fork in the service only. The image itself is skipped (no Docker needed).
invoker.goals = package -Dspring-boot.build-image.skip=true -Dspotless.check.skip=true -Dspotless.apply.skip=true
invoker.profiles = image
invoker.buildResult = success
