# A project inheriting synapse-parent: the effective POM and the dependency tree are written for verify.groovy. The
# second build writes the verbose tree, which shows the version grpc-api declares for guava before the pin manages it.
invoker.goals.1 = help:effective-pom -Doutput=effective-pom.xml dependency:tree -DoutputFile=tree.txt -Dspotless.check.skip=true
invoker.goals.2 = dependency:tree -Dverbose -DoutputFile=tree-verbose.txt -Dspotless.check.skip=true
invoker.buildResult = success
