# help:effective-pom writes the effective POM for verify.groovy; verify packages the jar without the aot profile, so
# no AOT processing runs, and the project has no application-build.yaml.
invoker.goals = help:effective-pom -Doutput=effective-pom.xml verify -Dspotless.check.skip=true -Dspotless.apply.skip=true
invoker.buildResult = success
