# Build 1: main sources and no tests, so there is no coverage data and the gate must fail.
invoker.goals.1 = verify -Dspotless.check.skip=true -Dspotless.apply.skip=true
invoker.buildResult.1 = failure
# Build 2: tests are skipped on purpose (for example a packaging-only run), so the gate must not apply.
invoker.goals.2 = verify -DskipTests -Dspotless.check.skip=true -Dspotless.apply.skip=true
invoker.buildResult.2 = success
# Build 3: the same with maven.test.skip, which also skips compiling the tests.
invoker.goals.3 = verify -Dmaven.test.skip=true -Dspotless.check.skip=true -Dspotless.apply.skip=true
invoker.buildResult.3 = success
# Build 4: skipTests=false runs the tests, so the gate applies again and must fail.
invoker.goals.4 = verify -DskipTests=false -Dspotless.check.skip=true -Dspotless.apply.skip=true
invoker.buildResult.4 = failure
