# Note: Dependabot reads this file from the repository's default branch only.
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      maven-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
    groups:
      docs:
        patterns: ["*"]

  # Hash-locked tools used by CI (diff-cover); Dependabot updates the .in file's pins and the hashes in the lock.
  - package-ecosystem: "pip"
    directory: "/.github/requirements"
    schedule:
      interval: "weekly"

# No entry for develop (0.4.x): security updates only ever target the default branch, so an entry there could only
# open version-update PRs. See specs/v2/DESIGN.md 4.1.
