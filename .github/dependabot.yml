# Note: Dependabot reads this file from the repository's default branch only.
version: 2
# Every entry waits 7 days after a release before proposing a version update (cooldown; Dependabot's default is 3).
# A compromised release is usually pulled within days. Security updates ignore cooldown.
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      maven-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows and a root action.yml only; the composite actions under .github/actions pin
    # actions too (directories accepts globs; directory does not). Any other directory is scanned for its own *.yml
    # files, so the service archetype's copy of buf.yml is named by its workflows directory.
    directories:
      - "/"
      - "/.github/actions/*"
      - "/archetypes/synapse-archetype-service/src/main/resources/archetype-resources/.github/workflows"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      # The archetype's buf.yml must equal .github/workflows/buf.yml byte for byte (the archetype-drift build rule and
      # the archetype's IT), so the actions it uses are bumped in one pull request per action across every directory
      # (group-by). Without it, a group opens one pull request per directory, and each fails the byte-for-byte rule
      # alone. A dependency goes to the first group it matches. group-by applies to version updates only: on a security
      # update of one of these actions, make the two copies equal by hand.
      archetype-workflow:
        group-by: dependency-name
        patterns: ["actions/checkout", "bufbuild/buf-action"]
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      docs:
        patterns: ["*"]

  # Hash-locked tools used by CI (diff-cover); Dependabot updates the .in file's pins and the hashes in the lock.
  - package-ecosystem: "pip"
    directory: "/.github/requirements"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

# No entry for develop (0.4.x): security updates only ever target the default branch, so an entry there could only
# open version-update PRs. See specs/v2/DESIGN.md 4.1.
