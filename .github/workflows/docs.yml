name: Docs

# Builds the Antora documentation site on every pull request and publishes it to GitHub Pages from main.
# Publishing needs Pages enabled with "GitHub Actions" as the source (repository settings).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read # check out the code and its history

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

# No dependency cache (Maven or npm) in this workflow: it publishes the site to GitHub Pages, and the build job
# compiles the modules (property tables) and produces the deployed artifact, so a poisoned cache entry would reach
# the published site. As in release.yml and snapshot-build.yml.
jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Antora reads versions from git history.
          fetch-depth: 0

      # The property tables are generated from compiled configuration metadata (see docs/tools/property-tables.mjs).
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          # No npm cache, explicitly: setup-node caches automatically when package.json names npm as packageManager.
          package-manager-cache: false

      - name: Build the site
        working-directory: docs
        run: |
          npm ci
          node --test "tools/*.test.mjs"
          npx antora --fetch antora-playbook.yml

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: docs/build/site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish the site to GitHub Pages
      id-token: write # OIDC token that actions/deploy-pages requires
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
