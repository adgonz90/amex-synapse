name: Nightly

# Slow checks that don't run on every pull request: mutation testing now; commercial-database integration
# tests (Oracle, SQL Server, DB2) are added here when those modules exist.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation-testing:
    name: Mutation testing (PIT)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify with mutation testing
        run: ./mvnw --batch-mode --no-transfer-progress -Pmutation verify
