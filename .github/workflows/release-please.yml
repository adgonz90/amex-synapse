name: Release Please

# Maintains the release pull request (version bump + CHANGELOG) from Conventional Commits on main. Merging that pull
# request creates the tag and GitHub release, and the publish job below then runs the release workflow for it.
#
# Publishing runs from this workflow rather than on a tag push because tags and releases created with the default
# GITHUB_TOKEN don't trigger other workflows. For the same reason, CI doesn't run on the release pull request unless
# RELEASE_PLEASE_TOKEN (a GitHub App or fine-grained token with contents and pull-requests write) is configured.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # RELEASE_PLEASE_TOKEN (optional) lives only in this environment.
    environment: release-please
    permissions:
      contents: write # push the release branch, tags and GitHub releases
      pull-requests: write # open and update the release pull request
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish ${{ needs.release-please.outputs.tag_name }}
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write # granted to release.yml: attach the SBOM to the GitHub release
      id-token: write # Sigstore OIDC token for signing the build-provenance attestations
      attestations: write # store the attestations
    # Keeps the ./ form: actionlint 1.7.12 rejects GitHub's newer $/ self-repository syntax. Switch when it supports it.
    uses: ./.github/workflows/release.yml # zizmor: ignore[self-repository]
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    # Passed by name: they live only in the "release" environment, which the called job selects.
    secrets:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
