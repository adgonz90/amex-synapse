name: Release

# Builds a release tag, signs it, publishes it to Maven Central, attaches the CycloneDX SBOM to the GitHub release
# and records build-provenance attestations. Called by release-please.yml after a release pull request is merged;
# workflow_dispatch exists for re-running a failed publish or for tagging a milestone by hand.
#
# Runs in the protected "release" environment, which holds the only copies of the signing key and Central token:
#   CENTRAL_USERNAME, CENTRAL_TOKEN   Central Portal user token
#   GPG_PRIVATE_KEY, GPG_PASSPHRASE   ASCII-armored signing key and its passphrase
#
# The job waits until Central has validated the deployment (a bad signature or POM fails the job), then Central
# publishes it automatically. It doesn't wait for publishing to finish, which can outlast the plugin's timeout.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, e.g. v2.0.0-M1
        required: true
        type: string
    # Required, so a missing secret fails the run instead of resolving to an empty string.
    secrets:
      CENTRAL_USERNAME:
        required: true
      CENTRAL_TOKEN:
        required: true
      GPG_PRIVATE_KEY:
        required: true
      GPG_PASSPHRASE:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. v2.0.0-M1
        required: true
        type: string

permissions: {}

jobs:
  publish:
    name: Publish ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write # attach the SBOM to the GitHub release
      id-token: write # Sigstore OIDC token for signing the build-provenance attestations
      attestations: write # store the attestations
    steps:
      - name: Check the tag format
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(M|RC)[0-9]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag (expected v2.0.0, v2.0.0-M1 or v2.0.0-RC1)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          server-id: central
          server-username-env-var: CENTRAL_USERNAME
          server-password-env-var: CENTRAL_TOKEN

      - name: Check the POM version matches the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="$(./mvnw --batch-mode --no-transfer-progress --quiet help:evaluate -Dexpression=project.version -DforceStdout)"
          if [ "v${version}" != "$TAG" ]; then
            echo "::error::POM version ${version} does not match tag ${TAG}."
            exit 1
          fi

      # Full build with tests and gates, then sign with Bouncy Castle (key from the environment, never imported
      # into a keyring) and upload to Central.
      - name: Build, sign and publish
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./mvnw --batch-mode --no-transfer-progress -Psynapse-release -Dgpg.signer=bc deploy

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            **/target/*.jar
            target/bom.json

      # release-please has already created the release; a milestone tagged by hand gets a prerelease here.
      - name: Attach the SBOM to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            prerelease=""
            if [[ "$TAG" == *-* ]]; then prerelease="--prerelease"; fi
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $prerelease
          fi
          gh release upload "$TAG" target/bom.json target/bom.xml --repo "$GITHUB_REPOSITORY" --clobber
