name: Release

# Builds a release tag, publishes it to Maven Central, attaches the CycloneDX SBOM to the GitHub release and records
# build-provenance attestations. Called by release-please.yml after a release pull request is merged;
# workflow_dispatch exists for re-running a failed publish or for tagging a milestone by hand.
#
# Two jobs, so the build never sees a secret:
#   build    No environment, no secrets, read-only token. Checks that the tag's commit is on main and matches the POM
#            version, runs the full build with its tests and gates, deploys to a local staging directory and uploads
#            it as the release-staging artifact. Outputs the commit it built.
#   publish  Runs in the protected "release" environment, which holds the only copies of the signing key and Central
#            token:
#              CENTRAL_USERNAME, CENTRAL_TOKEN   Central Portal user token
#              GPG_PRIVATE_KEY, GPG_PASSPHRASE   ASCII-armored signing key and its passphrase
#            After the approval wait it checks that the tag still points at the commit the build job built. It never
#            runs Maven or anything the build produced. .github/scripts/central-publish.sh checks that the staged
#            files are only this version's Synapse artifacts, signs them with a throwaway keyring, uploads the bundle
#            and waits until Central has validated it (a bad signature or POM fails the job). Central then publishes
#            it automatically; the job doesn't wait for publishing to finish.
#
# Both jobs run central-publish.sh from the default branch (checked out into trusted/), never from the tag, so a tag
# can't change the code that checks it or the code that handles the secrets.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, e.g. v2.0.0-M1
        required: true
        type: string
    # Required, so a missing secret fails the run instead of resolving to an empty string.
    secrets:
      CENTRAL_USERNAME:
        required: true
      CENTRAL_TOKEN:
        required: true
      GPG_PRIVATE_KEY:
        required: true
      GPG_PASSPHRASE:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. v2.0.0-M1
        required: true
        type: string

permissions: {}

jobs:
  build:
    name: Build ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: release-build
      cancel-in-progress: false
    permissions:
      contents: read # check out the tag and the default branch's scripts
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - name: Check the tag format
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(M|RC)[0-9]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag (expected v2.0.0, v2.0.0-M1 or v2.0.0-RC1)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          # Full history and every branch, so the tag can be checked against origin/main.
          fetch-depth: 0
          persist-credentials: false

      # The checking code comes from the default branch, not from the tag being checked.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
          sparse-checkout: /.github/scripts/
          sparse-checkout-cone-mode: false

      - name: Check the tag
        id: tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          bash trusted/.github/scripts/central-publish.sh check-tag "$TAG"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          # No dependency cache: a poisoned cache entry would end up in the released artifacts.

      - name: Check the POM version matches the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="$(./mvnw --batch-mode --no-transfer-progress --quiet help:evaluate -Dexpression=project.version -DforceStdout)"
          if [ "v${version}" != "$TAG" ]; then
            echo "::error::POM version ${version} does not match tag ${TAG}."
            exit 1
          fi

      # Full build with tests and gates, plus sources, javadoc and the SBOM; deployed to a local directory only.
      - name: Build and stage
        run: ./mvnw -B -ntp -Psynapse-release deploy "-DaltDeploymentRepository=staging::file:${GITHUB_WORKSPACE}/target/staging-deploy"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-staging
          path: |
            target/staging-deploy
            target/bom.json
            target/bom.xml
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish ${{ inputs.tag }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write # read the tag; attach the SBOM to the GitHub release
      id-token: write # Sigstore OIDC token for signing the build-provenance attestations
      attestations: write # store the attestations
    steps:
      # The approval wait can be long: refuse to publish if the tag was moved after the build job checked it.
      - name: Check the tag still points at the built commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          BUILT_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          if ! [[ "$BUILT_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The build job did not report the commit it built."
            exit 1
          fi
          current="$(gh api "repos/${GITHUB_REPOSITORY}/commits/refs/tags/${TAG}" --jq .sha)"
          if [ "$current" != "$BUILT_COMMIT" ]; then
            echo "::error::Tag ${TAG} now points at ${current}, not at ${BUILT_COMMIT}, which the build job built and checked."
            exit 1
          fi
          echo "Tag ${TAG} still points at ${BUILT_COMMIT}."

      # Only the publishing script, from the default branch; nothing from the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
          sparse-checkout: /.github/scripts/
          sparse-checkout-cone-mode: false

      # Outside the workspace: the staged files are data, never executed.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-staging
          path: ${{ runner.temp }}/release-staging

      - name: Sign and publish to Maven Central
        env:
          TAG: ${{ inputs.tag }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: bash trusted/.github/scripts/central-publish.sh release "${RUNNER_TEMP}/release-staging/staging-deploy" "${TAG#v}"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/release-staging/staging-deploy/**/*.jar
            ${{ runner.temp }}/release-staging/bom.json

      # release-please has already created the release; a milestone tagged by hand gets a prerelease here.
      - name: Attach the SBOM to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            prerelease=""
            if [[ "$TAG" == *-* ]]; then prerelease="--prerelease"; fi
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $prerelease
          fi
          gh release upload "$TAG" "${RUNNER_TEMP}/release-staging/bom.json" "${RUNNER_TEMP}/release-staging/bom.xml" \
            --repo "$GITHUB_REPOSITORY" --clobber
