name: Snapshot

# Publishes unsigned snapshots to the Central Portal snapshot repository (cleaned up by Central after 90 days):
#   - every push to main:                        2.0.0-SNAPSHOT
#   - pull requests labelled "publish-snapshot":  2.0.0-pr<number>-SNAPSHOT, republished on each push
#
# Only pull requests from branches in this repository can publish. Pull requests from forks never receive secrets
# (and must not, so pull_request_target is deliberately not used); their jars are attached to the CI run instead.
# Snapshots aren't signed, so the signing key is only ever available to the release workflow.
#
# Note: Maven orders 2.0.0-pr123-SNAPSHOT above 2.0.0, so never resolve "latest" from the snapshot repository.
on:
  push:
    branches: [main]
  pull_request:
    types: [labeled, synchronize, reopened]
    branches: [main]

permissions:
  contents: read # check out the code

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish snapshot
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'publish-snapshot'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The Central token lives only in this environment (no signing key; see REPOSITORY_SETUP.md).
    environment: snapshots
    steps:
      - name: Check for Central credentials
        id: credentials
        env:
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
        run: |
          if [ -z "$CENTRAL_TOKEN" ]; then
            echo "::notice::CENTRAL_USERNAME/CENTRAL_TOKEN secrets are not configured; skipping snapshot publishing."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.credentials.outputs.present == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.credentials.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '25'
          # No dependency cache in a publishing job: a poisoned cache entry would end up in published artifacts.
          server-id: central
          server-username-env-var: CENTRAL_USERNAME
          server-password-env-var: CENTRAL_TOKEN

      - name: Stamp the pull request version
        if: steps.credentials.outputs.present == 'true' && github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          current="$(./mvnw --batch-mode --no-transfer-progress --quiet help:evaluate -Dexpression=project.version -DforceStdout)"
          version="${current%-SNAPSHOT}-pr${PR_NUMBER}-SNAPSHOT"
          echo "Publishing ${version}"
          ./mvnw --batch-mode --no-transfer-progress --quiet versions:set \
            -DnewVersion="${version}" -DprocessAllModules=true -DgenerateBackupPoms=false
          ./mvnw --batch-mode --no-transfer-progress --quiet -pl parent/synapse-parent versions:set-property \
            -Dproperty=synapse.version -DnewVersion="${version}" -DgenerateBackupPoms=false

      # Tests and gates run again here so a snapshot is never published from a commit that fails them.
      - name: Build and publish
        if: steps.credentials.outputs.present == 'true'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
        run: ./mvnw --batch-mode --no-transfer-progress -Psynapse-snapshot deploy
