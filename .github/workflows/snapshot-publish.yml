name: Snapshot publish

# Publishes what snapshot-build.yml staged to the Central Portal snapshot repository, unsigned.
#
# workflow_run workflows always run from the default branch (main), so neither this file nor the publishing script
# can be changed by the run that triggered it. The triggering run's snapshot-staging artifact is untrusted data: it is
# downloaded outside the workspace and never executed. This job:
#   - runs only for a successful Snapshot build from this repository: a push to main, or a pull request
#   - checks snapshot.env strictly: HEAD_SHA must be the triggering run's commit, and VERSION must be
#     2.<minor>.<patch>-SNAPSHOT for main or 2.<minor>.<patch>-pr<PR_NUMBER>-SNAPSHOT for a pull request
#   - for main, checks that the commit is on main
#   - for a pull request, asks the GitHub API that PR_NUMBER is an open pull request into main from a branch in this
#     repository, carries the publish-snapshot label, and has the triggering run's commit as its head, so a run can't
#     publish under another pull request's number
#   - runs .github/scripts/central-publish.sh from main (never from the triggering run), which checks that the staged
#     files are only this version's Synapse artifacts before uploading them
# It never runs Maven and never checks out the triggering run's code.
#
# The Central token lives only in the "snapshots" environment, whose deployments are limited to main (no signing key;
# see REPOSITORY_SETUP.md). Until the secrets exist the job checks the artifact, prints what it would upload and skips
# publishing with a notice.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] runs no code from the triggering run; its artifact is only checked and uploaded
    workflows: [Snapshot build]
    types: [completed]

permissions: {}

jobs:
  publish:
    name: Publish snapshot
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      ((github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') ||
       github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: snapshots
    # One publish at a time per branch; a newer build waits for the running publish instead of cutting its upload short.
    concurrency:
      group: snapshot-publish-${{ github.event.workflow_run.event }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    permissions:
      actions: read # find and download the triggering run's snapshot-staging artifact
      contents: read # check out main's publishing script; check that a pushed commit is on main
      pull-requests: read # check the pull request's state, base, head commit and label
    steps:
      # A Snapshot build of a version that isn't a SNAPSHOT succeeds without uploading anything.
      - name: Find the staged snapshot
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Unexpected workflow run id: ${RUN_ID}"
            exit 1
          fi
          count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?name=snapshot-staging" \
            --jq '[.artifacts[] | select(.name == "snapshot-staging" and (.expired | not))] | length')"
          if [ "$count" = 0 ]; then
            echo "::notice::Snapshot build run ${RUN_ID} staged nothing; nothing to publish."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      # Only the publishing script, from main; nothing from the triggering run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.artifact.outputs.found == 'true'
        with:
          ref: main
          path: trusted
          persist-credentials: false
          sparse-checkout: /.github/scripts/
          sparse-checkout-cone-mode: false

      # Outside the workspace: the staged files are data, never executed.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.artifact.outputs.found == 'true'
        with:
          name: snapshot-staging
          path: ${{ runner.temp }}/snapshot-staging
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Check the run and the pull request
        id: check
        if: steps.artifact.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          skip() {
            echo "::warning::$* Not publishing."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          [[ "$RUN_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "Unexpected head commit for the triggering run: ${RUN_HEAD_SHA}"

          # snapshot.env must be exactly the three lines snapshot-build.yml writes. It is parsed, never sourced.
          env_file="${RUNNER_TEMP}/snapshot-staging/snapshot.env"
          [[ -f "$env_file" && ! -L "$env_file" ]] || fail "The artifact has no snapshot.env."
          (( $(wc -c < "$env_file") <= 512 )) || fail "snapshot.env is too large."
          mapfile -t lines < "$env_file"
          (( ${#lines[@]} == 3 )) || fail "snapshot.env must have exactly 3 lines, not ${#lines[@]}."
          [[ "${lines[0]}" =~ ^VERSION=(2\.[0-9]+\.[0-9]+(-pr[1-9][0-9]*)?-SNAPSHOT)$ ]] \
            || fail "snapshot.env line 1 is not VERSION=2.<minor>.<patch>[-pr<number>]-SNAPSHOT."
          version="${BASH_REMATCH[1]}"
          [[ "${lines[1]}" =~ ^PR_NUMBER=([1-9][0-9]{0,9})?$ ]] || fail "snapshot.env line 2 is not PR_NUMBER=[<number>]."
          pr_number="${BASH_REMATCH[1]}"
          [[ "${lines[2]}" =~ ^HEAD_SHA=([0-9a-f]{40})$ ]] || fail "snapshot.env line 3 is not HEAD_SHA=<40-hex commit>."
          head_sha="${BASH_REMATCH[1]}"
          [[ "$head_sha" == "$RUN_HEAD_SHA" ]] \
            || fail "snapshot.env names commit ${head_sha}, but the triggering run built ${RUN_HEAD_SHA}."

          case "$RUN_EVENT" in
            push)
              [[ -z "$pr_number" ]] || fail "A push to main staged a pull request snapshot (PR_NUMBER=${pr_number})."
              [[ "$version" =~ ^2\.[0-9]+\.[0-9]+-SNAPSHOT$ ]] || fail "Version ${version} is not a main snapshot version."
              status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${RUN_HEAD_SHA}...main" --jq .status)"
              [[ "$status" == identical || "$status" == ahead ]] \
                || fail "Commit ${RUN_HEAD_SHA} is not on main (compare status: ${status})."
              ;;
            pull_request)
              [[ -n "$pr_number" ]] || fail "A pull request run staged no PR_NUMBER."
              [[ "$version" =~ ^2\.[0-9]+\.[0-9]+-pr${pr_number}-SNAPSHOT$ ]] \
                || fail "Version ${version} is not a snapshot version for pull request #${pr_number}."
              # One field per line; a deleted head repository prints an empty line.
              pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq '
                .state, (.head.repo.full_name // ""), .head.sha, .base.ref,
                ([.labels[].name] | index("publish-snapshot") != null)')"
              mapfile -t fields <<< "$pr"
              (( ${#fields[@]} == 5 )) || fail "Unexpected answer from the pull request API for #${pr_number}."
              state="${fields[0]}" head_repo="${fields[1]}" pr_head_sha="${fields[2]}" base_ref="${fields[3]}"
              labelled="${fields[4]}"
              [[ "$head_repo" == "$GITHUB_REPOSITORY" ]] \
                || fail "Pull request #${pr_number} is not from a branch in ${GITHUB_REPOSITORY}."
              [[ "$base_ref" == main ]] || fail "Pull request #${pr_number} is not into main."
              [[ "$state" == open ]] || skip "Pull request #${pr_number} is ${state}."
              [[ "$labelled" == true ]] || skip "Pull request #${pr_number} no longer carries the publish-snapshot label."
              [[ "$pr_head_sha" == "$RUN_HEAD_SHA" ]] \
                || skip "Pull request #${pr_number} has moved on to ${pr_head_sha}; the run built ${RUN_HEAD_SHA}."
              ;;
            *) fail "Unexpected triggering event: ${RUN_EVENT}" ;;
          esac

          echo "Publishing ${version} (commit ${RUN_HEAD_SHA})."
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Publish to the snapshot repository
        if: steps.check.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
        run: |
          staging="${RUNNER_TEMP}/snapshot-staging/staging-deploy"
          if [ -z "$CENTRAL_USERNAME" ] || [ -z "$CENTRAL_TOKEN" ]; then
            echo "::notice::CENTRAL_USERNAME/CENTRAL_TOKEN secrets are not configured; skipping snapshot publishing."
            DRY_RUN=1 bash trusted/.github/scripts/central-publish.sh snapshot "$staging" "$VERSION"
            exit 0
          fi
          bash trusted/.github/scripts/central-publish.sh snapshot "$staging" "$VERSION"
