name: PR title

# Pull requests are squash-merged, so the PR title becomes the commit message on main that release-please reads.
# It must follow Conventional Commits (feat:, fix:, build:, chore:, docs:, test:, ...; "!" marks a breaking change).
#
# pull_request_target is used so this also works for pull requests from forks. It is safe here because the job
# never checks out or runs code from the pull request; it only reads the title through the API.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
    branches: [main]

permissions: {}

jobs:
  conventional-title:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
