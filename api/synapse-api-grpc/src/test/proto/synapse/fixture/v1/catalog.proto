// Test fixture of the gRPC plugin: the services and messages its binding, mapping and edge tests use.
syntax = "proto3";

package synapse.fixture.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option java_package = "io.americanexpress.synapse.api.grpc.fixture.proto";
option java_multiple_files = true;

// Unary methods bound to Synapse operations.
service CatalogService {
  rpc GetItem(GetItemRequest) returns (Item);
  rpc CreateItem(CreateItemRequest) returns (Item);
  rpc DeleteItem(DeleteItemRequest) returns (google.protobuf.Empty);
  rpc Ping(google.protobuf.Empty) returns (google.protobuf.Empty);
  rpc ListTags(ListTagsRequest) returns (ListTagsResponse);
  rpc Fail(FailRequest) returns (FailResponse);
}

// A service with a streaming method, which Synapse bindings reject.
service WatchService {
  rpc WatchItems(WatchItemsRequest) returns (stream Item);
}

// A method whose request's top-level field is repeated, for the empty-collection parity test (RestRoutesIT binds the
// same operation over REST).
service LabelService {
  rpc LabelItem(LabelItemRequest) returns (google.protobuf.Empty);
}

enum Genre {
  GENRE_UNSPECIFIED = 0;
  GENRE_FICTION = 1;
  GENRE_SCIENCE = 2;
}

message Author {
  optional string name = 1;
  optional string country_code = 2;
}

message Item {
  optional string id = 1;
  optional string name = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Duration ttl = 4;
  google.protobuf.Int32Value rating = 5;
  optional string note = 6;
  Genre genre = 7;
  repeated string tags = 8;
  map<string, int64> counts = 9;
  Author author = 10;
  oneof lookup {
    string sku = 20;
    string barcode = 21;
  }
  optional int64 version = 22;
}

message GetItemRequest {
  optional string id = 1;
}

message CreateItemRequest {
  Item item = 1;
}

message DeleteItemRequest {
  optional string id = 1;
}

message ListTagsRequest {
  optional string id = 1;
}

message ListTagsResponse {
  repeated string tags = 1;
}

message LabelItemRequest {
  repeated string tags = 1;
}

message FailRequest {
  optional string code = 1;
}

message FailResponse {
  string message = 1;
}

message WatchItemsRequest {
  optional string id = 1;
}

// A message whose field has no presence, for the nullable-component check.
message PlainNumbers {
  int32 year = 1;
}

// Two methods whose requests bind required scalars, for the startup rule that lists every one in one failure.
service PlainService {
  rpc First(Presence) returns (google.protobuf.Empty);
  rpc Second(Presence) returns (google.protobuf.Empty);
}

// Fields with and without presence, for the rule that a required scalar needs a field with presence.
message Presence {
  string title = 1;
  string author = 2;
  int32 pages = 3;
  google.protobuf.Int32Value count = 4;
  Genre genre = 5;
  Shelf shelf = 6;
  PlainAuthor writer = 7;
  Meta meta = 8;
  repeated string tags = 9;
}

// A required scalar with presence.
message Titled {
  optional string title = 1;
}

message PlainAuthor {
  string name = 1;
}

message Meta {
  string code = 1;
}

// Every scalar type, wrapper and container shape, for the mapping tests.
message Scalars {
  optional int32 int32_value = 1;
  optional sint32 sint32_value = 2;
  optional sfixed32 sfixed32_value = 3;
  optional uint32 uint32_value = 4;
  optional fixed32 fixed32_value = 5;
  optional int64 int64_value = 6;
  optional sint64 sint64_value = 7;
  optional sfixed64 sfixed64_value = 8;
  optional uint64 uint64_value = 9;
  optional fixed64 fixed64_value = 10;
  optional bool bool_value = 11;
  optional double double_value = 12;
  optional float float_value = 13;
  optional bytes bytes_value = 14;
  google.protobuf.DoubleValue double_wrapper = 20;
  google.protobuf.FloatValue float_wrapper = 21;
  google.protobuf.Int64Value int64_wrapper = 22;
  google.protobuf.UInt64Value uint64_wrapper = 23;
  google.protobuf.Int32Value int32_wrapper = 24;
  google.protobuf.UInt32Value uint32_wrapper = 25;
  google.protobuf.BoolValue bool_wrapper = 26;
  google.protobuf.StringValue string_wrapper = 27;
  google.protobuf.BytesValue bytes_wrapper = 28;
  repeated Author authors = 30;
  map<int32, Author> authors_by_rank = 31;
  repeated google.protobuf.Timestamp times = 32;
  repeated Genre genres = 33;
  optional Genre optional_genre = 34;
  optional Shelf shelf = 35;
}

// An enum whose values are named like the Java constants and whose zero value is a real value.
enum Shelf {
  TOP = 0;
  BOTTOM = 1;
}

// A message that contains itself, for recursive records.
message Node {
  optional string name = 1;
  Node next = 2;
}

// A oneof whose members are messages, for the output oneof check.
message Choice {
  oneof pick {
    Author first = 1;
    Author second = 2;
  }
}

// A oneof whose members have fields with presence, for components that write inside one member.
message NoteChoice {
  oneof pick {
    Note first = 1;
    Note second = 2;
  }
}

message Note {
  optional string title = 1;
  optional string text = 2;
}
