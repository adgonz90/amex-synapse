// Test fixture of the gRPC test slice: the services its slice tests start.
syntax = "proto3";

package synapse.slice.v1;

option java_package = "io.americanexpress.synapse.test.grpc.fixture.proto";
option java_multiple_files = true;

// Bound to a Synapse operation with .unary.
service CatalogService {
  rpc GetItem(GetItemRequest) returns (Item);
}

// Implemented by a hand-written service.
service PingService {
  rpc Ping(PingRequest) returns (PingReply);
}

// Bound by name with .bindAllByName().
service InventoryService {
  rpc GetStock(GetStockRequest) returns (Stock);
  rpc CountItems(CountItemsRequest) returns (ItemCount);
}

message GetItemRequest {
  string id = 1;
}

message Item {
  string id = 1;
  string name = 2;
  int32 rating = 3;
}

message PingRequest {
  string message = 1;
}

message PingReply {
  string message = 1;
}

message GetStockRequest {
  string sku = 1;
}

message Stock {
  string sku = 1;
  int32 quantity = 2;
}

message CountItemsRequest {
  string category = 1;
}

message ItemCount {
  int64 count = 1;
}
